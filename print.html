<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cetak Nota</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #eef1f5; color: #1f2937; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 16px; }
  .nota { background: #fff; padding: 14px 12px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12);
          font-family: "Courier New", monospace; font-size: 13px; white-space: pre; overflow-x: auto; line-height: 1.35; }
  .btns { display: grid; gap: 10px; margin-top: 14px; }
  button { font-size: 16px; padding: 14px; border: 0; border-radius: 8px; font-weight: 600; }
  .p { background: #1F3864; color: #fff; }
  .s { background: #fff; color: #1F3864; border: 1px solid #1F3864; }
  .info { font-size: 12px; color: #6b7280; margin-top: 12px; line-height: 1.5; }
  .ttd { background: #fff; padding: 0 12px 12px; margin-top: -4px; border-radius: 0 0 8px 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12); display: none; }
  .ttd img { width: 60%; max-width: 220px; display: block; }
  .ttd .lbl { font-family: "Courier New", monospace; font-size: 13px; padding-top: 6px; }
  @media print {
    @page { size: 58mm auto; margin: 2mm; }
    body { background: #fff; }
    .wrap { padding: 0; max-width: none; }
    .nota { box-shadow: none; padding: 0; font-size: 10px; border-radius: 0; }
    .ttd { box-shadow: none; padding: 0; margin: 0; }
    .ttd .lbl { font-size: 10px; }
    .btns, .info { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="nota" class="nota">Memuat nota…</div>
  <div id="ttd" class="ttd"><div class="lbl">Tanda tangan toko</div><img id="ttdImg" alt="TTD toko"><div class="lbl">________________</div></div>
  <div class="btns">
    <button class="p" id="bPrint">🖨️ Cetak ke printer (RawBT)</button>
    <button class="s" id="bShare">📤 Kirim ke RawBT (via Bagikan)</button>
    <button class="s" id="bPdf">📄 Cetak dgn TTD / Simpan PDF</button>
  </div>
  <div class="info" id="info">Kalau RawBT tidak terbuka: pastikan RawBT ter-install dan printer sudah dipilih di RawBT.</div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var t = (q.get('t') || '').replace(/\|/g, '\n').replace(/–|—/g, '-');
  if (!t) t = 'Nota kosong.\nBuka halaman ini dari tombol Print Nota di app.';
  document.getElementById('nota').textContent = t;
  if (q.get('id')) document.title = 'Nota ' + q.get('id');

  // TTD toko (link gambar dari AppSheet, parameter sig). Kalau kosong / gagal dimuat, nota tetap tampil tanpa TTD.
  var BACKUP_URL = 'https://script.google.com/macros/s/AKfycbyvD_hPde7aX5y9ZiHLM7hHP9lBdFXqUVAZ4TX9TTN59aySod03GExJ-Omi1Skp4jZ_jQ/exec';     // ← ganti dengan URL Web App NOTA_BACKUP (…/exec)
  var KUNCI = 'BKL-NOTA-7Q4X29';
  var sig = q.get('sig') || '', tw = q.get('tw') || '', id = q.get('id') || '';
  var BASE = 'https://www.appsheet.com/template/gettablefileurl?appName=PenjualanSalesTEST-193989837&tableName=Penjualan&fileName=';
  var calon = [];                                   // daftar link TTD yang dicoba
  if (sig.indexOf('http') === 0) calon = [sig];                       // link lengkap dari AppSheet
  else if (sig) calon = [BASE + encodeURIComponent(sig)];             // nama file saja
  else if (tw && id) {
    // Langsung setelah Save: nama file belum terbaca. Pola nama: <ID_Jual>.TTD_Toko.<HHMMSS UTC>.png
    // Tebak dari Waktu_TTD (WIB, -7 jam) ±8 detik.
    var p = tw.replace(/[^0-9]/g, '');
    if (p.length >= 6) {
      var dtk = (+p.slice(0,2)) * 3600 + (+p.slice(2,4)) * 60 + (+p.slice(4,6)) - 7 * 3600;
      var off = [0]; for (var k = 1; k <= 8; k++) off.push(-k, k);
      off.forEach(function (o) {
        var x = ((dtk + o) % 86400 + 86400) % 86400;
        var hh = ('0' + Math.floor(x / 3600)).slice(-2), mm = ('0' + Math.floor(x % 3600 / 60)).slice(-2), ss = ('0' + x % 60).slice(-2);
        calon.push(BASE + encodeURIComponent('Penjualan_Images/' + id + '.TTD_Toko.' + hh + mm + ss + '.png'));
      });
    }
  }
  if (calon.length) {
    var im = document.getElementById('ttdImg');
    var info = document.getElementById('info'), idx = 0, putaran = 0, MAKS = 40;   // ulang tiap ±3 detik, maks ±2 menit (tunggu upload TTD)
    im.onload = function () {
      // tampilan: buang 'Tanda tangan toko' + garis dari teks, pindah ke blok TTD (label → gambar → garis)
      var i = t.lastIndexOf('Tanda tangan toko');
      if (i >= 0) document.getElementById('nota').textContent = t.slice(0, i).replace(/\s+$/, '') + '\n';
      document.getElementById('ttd').style.display = 'block'; info.textContent = '';
      backup_(im.src);
    };
    im.onerror = function () {
      idx++;
      if (idx < calon.length) { im.src = calon[idx]; return; }       // coba kandidat berikutnya
      idx = 0; putaran++;
      if (putaran < MAKS) {
        info.textContent = 'Menunggu TTD ter-upload… (' + putaran + ')';
        cariNama_(function () { setTimeout(function () { im.src = calon[0] + '&r=' + Date.now(); }, 3000); });
      } else {
        info.textContent = 'TTD belum bisa dimuat (cek internet / tunggu sync), cetak teks tetap bisa.';
      }
    };
    // Tanya nama file TTD ke Web App (baca DB Penjualan.TTD_Toko). Ketemu → pakai nama pasti, tidak menebak lagi.
    var namaPasti = !!sig;
    function cariNama_(lanjut) {
      if (namaPasti || !id || BACKUP_URL.indexOf('http') !== 0) return lanjut();
      fetch(BACKUP_URL + '?k=' + encodeURIComponent(KUNCI) + '&id=' + encodeURIComponent(id))
        .then(function (r) { return r.text(); })
        .then(function (n) {
          n = String(n || '').trim();
          if (n.indexOf('Penjualan_Images/') === 0) { calon = [BASE + encodeURIComponent(n)]; namaPasti = true; }
          lanjut();
        }).catch(function () { lanjut(); });
    }
    im.src = calon[0];
  }


  // MOM #10: backup nota + TTD ke Google Drive (Apps Script Web App). Gagal = diam, cetak tetap jalan.
  var sudahBackup = false;
  function backup_(srcTtd) {
    if (sudahBackup || !id || BACKUP_URL.indexOf('http') !== 0) return;
    sudahBackup = true;
    var teks = t.replace(/^\*\*\* CETAK ULANG[^\n]*\n[^\n]*\n\n/, '');   // tanpa header cetak ulang
    fetch(BACKUP_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ k: KUNCI, id: id, t: teks, sig: String(srcTtd).replace(/&r=\d+$/, '') }) }).catch(function () {});
  }

  function b64(s) { return btoa(unescape(encodeURIComponent(s))); }
  var full = t + '\n\n\n';
  var data = b64(full);
  var PKG = 'package=ru.a402d.rawbtprinter;end;';
  // format resmi RawBT: intent:<teks/encodeURI>#Intent;scheme=rawbt;package=...;end;
  var intentText = 'intent:' + encodeURI(full) + '#Intent;scheme=rawbt;' + PKG;
  var intentB64 = 'intent:base64,' + data + '#Intent;scheme=rawbt;' + PKG;
  var schemeUrl = 'rawbt:base64,' + data;
  var info = document.getElementById('info');

  document.getElementById('bPrint').onclick = function () {
    var isAndroid = /Android/i.test(navigator.userAgent);
    if (!isAndroid) { location.href = schemeUrl; return; }
    info.textContent = 'Membuka RawBT… kalau tidak terbuka dalam 2 detik, pakai tombol "Kirim ke RawBT (via Bagikan)".';
    location.href = intentText;
    setTimeout(function () { if (document.visibilityState === 'visible') location.href = intentB64; }, 1200);
  };
  document.getElementById('bShare').onclick = function () {
    if (navigator.share) {
      navigator.share({ title: document.title, text: full }).catch(function () {});
    } else {
      info.textContent = 'HP ini tidak mendukung Bagikan. Pakai tombol Cetak.';
    }
  };
  document.getElementById('bPdf').onclick = function () { window.print(); };

  // coba langsung buka RawBT sekali (sebagian browser butuh tap tombol)
  if (q.get('auto') === '1' && /Android/i.test(navigator.userAgent)) {
    setTimeout(function () { location.href = intentText; }, 400);
  }
})();
</script>
</body>
</html>
